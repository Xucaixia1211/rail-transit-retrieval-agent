manifest_version: 1
project: rail-transit-retrieval-agent
description: >-
  可追溯的轨道交通检索语料来源清单。受限来源仅允许下载到本地忽略目录；
  明确开放许可的来源仍默认不提交原始文件，后续发布样例时必须逐项保留署名和许可证。

defaults:
  output_root: data/raw
  timeout_seconds: 60
  retries: 3
  request_delay_seconds: 0.6
  max_file_size_mb: 350
  require_https: true
  user_agent: >-
    RailTransitRetrievalAgent/0.1
    (academic portfolio corpus builder; contact: xucaixia@163.sufe.edu.cn)

